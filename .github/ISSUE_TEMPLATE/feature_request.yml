name: Feature Request / 功能建议
description: Suggest a new feature or improvement / 提出新功能或优化建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请描述你想要的功能以及背后的使用场景。中英文均可。
        Thanks for the idea! Please describe what you want and the use case behind it. Chinese or English is fine.
  - type: textarea
    id: proposal
    attributes:
      label: 建议描述 / Proposal
      description: 你想要什么功能？/ What feature would you like to see?
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: 使用场景 / Use Case
      description: 这个功能能解决什么问题？/ What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 是否考虑过其他实现方式？/ Have you considered any alternatives?
    validations:
      required: false
