[package]
name = "floralis"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"
description = "花譜 Floralis —— 面向视觉小说与独立游戏玩家的本地游戏库管理工具"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-runtime = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
log = "0.4"
chrono = { version = "0.4", features = ["clock"] }
ureq = { version = "2", features = ["json"] }
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
hostname = "0.4"
keyring = { version = "3", features = ["windows-native"] }
getrandom = "0.2"
image = "0.25"
urlencoding = "2"
winreg = "0.52"
winapi = { version = "0.3", features = ["tlhelp32", "processthreadsapi", "handleapi", "winnt", "winbase", "minwindef", "winuser"] }
notify = "8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# 集成测试需要 tauri::test::mock_app 构造托管状态
tauri = { version = "2", features = ["test"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
